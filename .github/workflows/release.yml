name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install fish
        run: sudo apt-get update && sudo apt-get install -y fish

      - name: Install just
        run: sudo apt-get install -y just

      - name: Install fisher
        shell: fish {0}
        run: curl -sL https://raw.githubusercontent.com/jorgebucaran/fisher/main/functions/fisher.fish | source && fisher install jorgebucaran/fisher

      - name: Install fishtape
        shell: fish {0}
        run: fisher install jorgebucaran/fishtape

      - name: Run CI checks
        shell: fish {0}
        run: just ci

      - name: Create release archives
        run: |
          mkdir -p dist
          git archive --format=tar.gz --prefix="opah.fish-${GITHUB_REF_NAME}/" -o "dist/opah.fish-${GITHUB_REF_NAME}.tar.gz" HEAD
          git archive --format=zip --prefix="opah.fish-${GITHUB_REF_NAME}/" -o "dist/opah.fish-${GITHUB_REF_NAME}.zip" HEAD

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.zip
