name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install fish
        uses: fish-shop/install-fish-shell@v2

      - name: Syntax check
        uses: fish-shop/syntax-check@v2
        with:
          patterns: "{functions,completions,conf.d,tests}/**.fish"

      - name: Indent check
        uses: fish-shop/indent-check@v2
        with:
          patterns: "{functions,completions,conf.d,tests}/**.fish"

      - name: Run tests
        uses: fish-shop/run-fishtape-tests@v2
        with:
          patterns: tests/**.fish

      - name: Create release archives
        run: |
          mkdir -p dist
          git archive --format=tar.gz --prefix="opah.fish-${GITHUB_REF_NAME}/" -o "dist/opah.fish-${GITHUB_REF_NAME}.tar.gz" HEAD
          git archive --format=zip --prefix="opah.fish-${GITHUB_REF_NAME}/" -o "dist/opah.fish-${GITHUB_REF_NAME}.zip" HEAD

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.zip
