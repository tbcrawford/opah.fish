name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install fish
        uses: fish-shop/install-fish-shell@v2

      - name: Syntax check
        uses: fish-shop/syntax-check@v2
        with:
          patterns: "{functions,completions,conf.d,tests}/**.fish"

      - name: Indent check
        uses: fish-shop/indent-check@v2
        with:
          patterns: "{functions,completions,conf.d,tests}/**.fish"

      - name: Run tests
        uses: fish-shop/run-fishtape-tests@v2
        with:
          patterns: tests/**.fish
